<article
    class="tw-relative tw-flex tw-flex-col tw-bg-surface tw-rounded--2xl tw-min-h-[200px]     lg:tw-min-w-[280px] tw-max-w-[260px] md:tw-max-w-[280px] tw-place-self-center tw-drop-shadow-xl tw-drop-shadow-muted/30">
    <figure [routerLink]="['/home/product', product()._id]"
        class="tw-rounded-t-2xl tw-overflow-hidden tw-group tw-cursor-pointer  tw-max-h-[220px] tw-min-h-[220px] ">
        <img (error)="onImgError($event)" [src]="product().images[0].url" [alt]="  product().name+'s Picture'"
            [routerLink]="['/shop', product().name || '']"
            class="tw-size-full tw-object-cover tw-rounded-t-2xl tw-group-hover:tw-scale-105 tw-transition-all tw-duration-200 tw-group-hover:tw-brightness-90 tw-ease-in-out" />
    </figure>
    <div class="tw-flex tw-flex-col tw-left-0 tw-bottom-0 tw-ga-1.5 tw-w-full tw-bg-bg tw-p-5 tw-rounded--b-2xl">
        <div class="tw-flex tw-items-center tw-justify-between"><span class="tw-text-xl tw-text-muted"> {{
                product().category}}

            </span>
            <button
                class="tw-grid tw-top-2 tw-right-2 tw-place-items-center p-2 tw-cursor-pointer tw-border tw-border-border tw-transition tw-duration-100 hover:tw-bg-border/20"
                aria-label="Add Product To Wishlist"><svg xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24" stroke-width="1.5" stroke="red"
                    [attr.fill]="isFavorite(product()!._id) ? 'red' : 'none'" class="tw-size-6"
                    [ngClass]="isFavorite(product()!._id) ? 'tw-rotate-360 tw-transition-transform tw-duration-500 tw-ease-in-out' : ''">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                </svg></button>
        </div>
        <h3 class="tw-text-2xl tw-font-medium tw-lineclamp-1"> {{ product().name || 'Name not available'}}

        </h3>
        <ul class=" tw-pl-0 tw-flex tw-items-center tw-space-x-1">@for (star of productsStars(5); track $index) {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#F6B76F"
                fill="#F6B76F" class="tw-size-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
            </svg>
            }

        </ul>
        <div class="tw-flex tw-items-center tw-justify-between tw-pt-3.5 tw-gap-3">
            <span class="tw-text-xl tw-font-medium">₹ {{ product()?.price || 0}}
            </span>
            <button (click)="!!currentUserData ? addToCart(product()): gologinSignup('signup')"
                class="tw-inline-flex tw-items-center tw-bg-accent tw-ga-1.5 tw-px-3 tw-py-1 tw-text-surface tw-rounded--full tw-transition-colors tw-duration-100 hover:tw-bg-accent/90 tw-cursor-pointer"
                aria-label="Add To Cart">Add To Cart <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="tw-size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                    </svg></span>
            </button>
        </div>
    </div>
</article>
