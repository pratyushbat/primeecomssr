<div class="tw-min-h-screen tw-flex tw-items-center tw-justify-center tw-bg-gray-50 tw-px-4">
    <div class="tw-bg-white tw-rounded-2xl tw-shadow-xl tw-max-w-md tw-w-full tw-p-8 tw-text-center">

        <!-- Success Icon -->
        <div
            class="tw-mx-auto tw-flex tw-items-center tw-justify-center tw-h-20 tw-w-20 tw-rounded-full tw-bg-green-100">
            <svg class="h-12 w-12 text-green-600" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <!-- Title -->
        <h1 class="tw-mt-6 tw-text-2xl tw-font-bold tw-text-gray-800">
            Payment Successful 🎉
        </h1>

        <!-- Message -->
        <p class="mt-3 tw-text-gray-600">
            Thank you for your purchase. Your payment has been processed successfully.
        </p>

        <!-- Order Info -->
        <div class="tw-mt-6 border tw-transition p-4 text-left tw-bg-gray-50">
            <div class="tw-flex tw-justify-between tw-text-sm tw-text-gray-700">
                <span>Order ID</span>
                <span class="font-medium">asdas<!-- {{ orderId }} --></span>
            </div>
            <div class="tw-flex tw-justify-between tw-text-sm tw-text-gray-700 tw-mt-2">
                <span>Amount Paid</span>
                <span class="font-medium">₹<!-- {{ amount }} --></span>
            </div>
            <div class="tw-flex tw-justify-between tw-text-sm tw-text-gray-700 tw-mt-2">
                <span>Payment Method</span>
                <span class="font-medium">PhonePe</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="tw-mt-8 tw-flex tw-flex-col gap-3">
            <button [routerLink]="'/home/orders'"
                class="tw-w-full tw-bg-green-600 hover:tw-bg-green-700 tw-text-white tw-font-semibold tw-py-3 tw-transition tw-transition">
                View My Orders
            </button>

            <button [routerLink]="'/home'"
                class="tw-w-full border border-gray-300 hover:bg-gray-100 tw-text-gray-700 tw-font-semibold tw-py-3 tw-transition tw-transition">
                Continue Shopping
            </button>
        </div>
    </div>
</div>
