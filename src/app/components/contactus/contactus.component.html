<div class="container tw-py-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">

      <div class="text-center mb-5">
        <h1 class="fw-bold">Contact Us</h1>
        <p class="text-muted">
          We’d love to hear from you. Please fill out the form below.
        </p>
      </div>

      <div class="row g-4">

        <!-- CONTACT FORM -->
        <div class="col-md-7">
          <div class="card contact-card p-4">
            <h5 class="mb-3">Send us a message</h5>

            <form [formGroup]="contactUsForm" (ngSubmit)="saveContact()">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="name">Name</label>
                  <input type="text" id="name" name="name" formControlName="name" class="form-control"
                    placeholder="Your name" required>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label" for="email">Email</label>
                  <input type="email" id="email" name="email" formControlName="email" class="form-control"
                    placeholder="Your email" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="phone">Phone</label>
                <input type="text" id="phone" name="phone" formControlName="phone" class=" tw-w-full tw-h-full"
                  placeholder="Phone Number" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="subject">Subject</label>
                <input type="text" id="subject" name="subject" formControlName="subject" class="form-control"
                  placeholder="Subject">
              </div>

              <div class="mb-3">
                <label class="form-label" for="message">Message</label>
                <textarea id="message" name="message" class="form-control" formControlName="message" rows="4"
                  placeholder="Your message" required></textarea>
              </div>

              <button type="submit" class="btn btn-success">
                Send Message
              </button>
            </form>
          </div>
        </div>

        <!-- CONTACT INFO -->
        <div class="col-md-5">
          <div class="card contact-card p-4 h-100">
            <h5 class="mb-3">Get in touch</h5>

            <div class="contact-info mb-3">
              <i class="bi bi-geo-alt-fill me-2"></i>
              <span>New Delhi, India</span>
            </div>

            <div class="contact-info mb-3">
              <i class="bi bi-envelope-fill me-2"></i>
              <span>support&#64;girisa.shop</span>
            </div>

            <div class="contact-info mb-3">
              <i class="bi bi-telephone-fill me-2"></i>
              <span>+91 8383973383</span>
            </div>

            <hr>

            <p class="text-muted">
              Customer support available Monday to Saturday,
              10:00 AM – 6:00 PM.
            </p>

            <div class="mt-3">
              <a href="#" class="me-2 text-dark">
                <i class="bi bi-facebook"></i>
              </a>
              <a href="#" class="me-2 text-dark">
                <i class="bi bi-instagram"></i>
              </a>
              <a href="#" class="text-dark">
                <i class="bi bi-twitter"></i>
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
